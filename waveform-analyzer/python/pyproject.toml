[project]
name = "waveform-report"
version = "0.1.0"
description = "Waveform JSON + stats for Allure reports"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
allure = ["allure-pytest>=2.13"]

[project.entry-points.pytest11]
waveform_report = "waveform_report.pytest_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["waveform_report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
